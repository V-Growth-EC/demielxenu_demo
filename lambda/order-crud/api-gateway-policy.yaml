AWSTemplateFormatVersion: '2010-09-09'
Description: 'API Gateway Resource Policy for IP Restriction'

Parameters:
  AllowedIPRanges:
    Type: CommaDelimitedList
    Default: '203.0.113.0/24,198.51.100.0/24'
    Description: 'Comma-delimited list of IP ranges to allow'

Resources:
  APIGatewayResourcePolicy:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-restricted-api'
      Description: 'API Gateway with IP restrictions'
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/*'
            Condition:
              StringNotEquals:
                'aws:SourceIp': !Ref AllowedIPRanges
          - Effect: Allow
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/*'
            Condition:
              StringEquals:
                'aws:SourceIp': !Ref AllowedIPRanges

Outputs:
  RestApiId:
    Description: 'API Gateway Rest API ID'
    Value: !Ref APIGatewayResourcePolicy
    Export:
      Name: !Sub '${AWS::StackName}-RestApiId'
  
  RestApiUrl:
    Description: 'API Gateway Rest API URL'
    Value: !Sub 'https://${APIGatewayResourcePolicy}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${AWS::StackName}-RestApiUrl'
